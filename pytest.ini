[pytest]
addopts = -m "not e2e and not smoke"
markers =
    e2e: browser-driven end-to-end tests against the running app
    smoke: lightweight smoke pass for the e2e suite
    batch2: batch 2 frontend end-to-end cases
    batch3: batch 3 frontend end-to-end cases
    batch4: batch 4 frontend end-to-end cases
